<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e84a5a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="毛線小世界">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23fff0e8'/%3E%3Ccircle cx='8' cy='8' r='5.5' fill='%23ff5a8a'/%3E%3Cpath d='M3.5 6.5c3 1 6 1 9 0M3 9c3.3 1 6.7 1 10 0M5 4c2 3 2 6 0 9' stroke='%23fff' stroke-width='.8' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<title>毛線小世界 YARN LAND</title>
<style>
  /* 共用版面在 arcade-core/ui/hud.css(src/main.js import,比這裡晚載入 → 這裡的選擇器都加 html 提高優先權);這裡只放這款的毛線樣式 */
  html:root{--loop-label:"跳";--loop-fs:1.25;--loop-bg:rgba(255,122,154,.6);
    --red:#ff5a7a;--cyan:#7ae0ff;--yellow:#ffe07a;--white:#fffaf4;--bg:#5a3a48;--line:#ffb0c8;--panel:rgba(90,58,72,.85);
    --soft:"Baloo 2","Noto Sans TC","PingFang TC",system-ui,sans-serif}
  html #crt{display:none!important} /* 布紋 / 縫線框在 shader 裡(skin.js LOOK.style),不用共用的紙紋 */
  html #hud,html #hudB,html #msg,html .pop,html #combo{text-shadow:0 2px 0 #5a3a48,0 0 4px #5a3a48,0 0 8px rgba(90,58,72,.6)}
  html #btnLoop{border:3px dashed rgba(255,255,255,.9);box-shadow:none}
  html .hbtn{background:rgba(90,58,72,.55);border:2px dashed rgba(255,255,255,.6)}
  html .overlay{background:radial-gradient(ellipse at 50% 45%,rgba(90,58,72,.3),rgba(90,58,72,.82))}
  /* 標題:縫在一塊毛氈補丁上的字(虛線縫邊) */
  html .patch{display:inline-block;margin:.2em auto .4em;padding:.25em .6em .15em;background:#ff8ab0;border-radius:22px;
    box-shadow:0 0 0 5px #ff8ab0,0 6px 0 5px #c85a80;outline:3px dashed #fff4f8;outline-offset:-9px}
  html #title .logo.big{font-family:var(--soft);font-weight:800;font-size:clamp(40px,13vw,72px);letter-spacing:.04em;line-height:1.15;background:none;color:#fffaf4;
    filter:none;margin:0;text-shadow:0 3px 0 #c85a80,0 6px 0 #5a3a48}
  html #title .year{font-family:var(--soft);font-weight:800;letter-spacing:.3em;color:#ffe07a;text-shadow:0 2px 0 #5a3a48}
  html #title .sub{color:#7ae0ff}
  html .pop,html #msg .big{font-family:var(--soft),var(--cjk)}
</style>
</head>
<body class="title">
<canvas id="view"></canvas>
<div id="crt"></div>

<div id="hud">
  <div><div class="lbl blink" id="oneup">1UP</div><div id="score">00</div></div>
  <div class="c"><div class="lbl">HI-SCORE</div><div id="hi">20000</div></div>
  <div class="r"><div id="hudBtns"><button class="hbtn" id="btnMute" aria-label="sound">♪</button><button class="hbtn" id="btnPause" aria-label="pause">II</button></div><div id="stageNo"></div></div>
</div>
<div id="bossBar" class="hidden"><div id="bossName"></div><div id="bossHp"><div id="bossFill"></div></div></div>
<div id="hudB"><div id="lives"></div>
  <div id="status"><span id="evoName">Lv.1 新手娃娃</span><div class="r2"><div id="pwr"></div><div id="loops"></div></div><div id="xp"><div id="xpFill"></div></div></div>
  <div id="badges"></div></div>
<div id="msg"></div>
<button id="btnLoop" aria-label="跳">跳</button>
<div id="combo"></div>
<div id="feed"></div>
<div id="flash"></div>

<div id="title" class="overlay">
  <div class="card">
    <div class="patch"><div class="logo big">毛線小世界</div></div>
    <div class="year">YARN LAND</div>
    <div class="sub">小毛 · 三十段毛線冒險</div>
    <button class="start blink" id="btnStart">TAP TO START</button>
    <div class="table">
      <span></span><span class="h">編隊中</span><span class="h">俯衝中</span>
      <img class="px" id="sBoss" alt="剪刀螃蟹"><span class="yellow">150</span><span class="yellow">400-1600</span>
      <img class="px" id="sBfly" alt="飛蛾"><span>80</span><span>160</span>
      <img class="px" id="sBee" alt="襪子怪"><span>50</span><span>100</span>
    </div>
    <div class="table items">
      <span class="red">P</span><span class="h">毛線球</span><span class="cyan">R</span><span class="h">快快織</span><span class="green">S</span><span class="h">棉花</span>
      <span style="color:#c8a8f0">B</span><span class="h">大毛球</span><span style="color:#d8a070">W</span><span class="h">泰迪熊</span><span class="yellow">1UP</span><span class="h">甜甜圈</span>
    </div>
    <div class="small">三十段 · BEST <span id="bestStage">1</span> · 選關(測試用全部開放)</div>
    <div class="row" id="stageSel"></div>
    <div class="hint" id="hint"></div>
    <div class="row"><button class="sbtn" id="btnSnd">SOUND ON</button><button class="sbtn" id="btnCrt">布紋 ON</button></div>
    <div class="small">HI-SCORE <span id="tHi">20000</span></div>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="card">
    <div class="logo" style="font-size:34px">PAUSE</div>
    <div class="row"><button class="sbtn" id="btnResume">RESUME</button><button class="sbtn" id="btnQuit">QUIT</button></div>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="card">
    <div class="logo" style="font-size:30px">RESULTS</div>
    <div class="res">
      <div class="red">SCORE <span class="white" id="rScore">0</span></div>
      <div class="red">第幾段 <span class="white" id="rStage">1</span></div>
      <div class="yellow">蓬鬆度 <span class="white" id="rEvo">Lv.1</span></div>
      <div class="yellow">MAX COMBO <span class="white" id="rCombo">0</span></div>
      <div class="yellow">ENEMIES DOWN <span class="white" id="rKills">0</span></div>
      <div class="yellow">SHOTS FIRED <span class="white" id="rShots">0</span></div>
      <div class="yellow">NUMBER OF HITS <span class="white" id="rHits">0</span></div>
      <div class="cyan">HIT-MISS RATIO <span class="white" id="rRatio">0 %</span></div>
    </div>
    <button class="start blink" id="btnAgain">TAP TO CONTINUE</button>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
