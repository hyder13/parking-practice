<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1e2a4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="百鬼夜行">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231e2a4a'/%3E%3Crect x='3' y='3' width='10' height='10' rx='1' fill='%23c8323a'/%3E%3Cpath d='M5 6h6M5 10h6M8 4v8' stroke='%23f8f0e0' stroke-width='1.3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<title>百鬼夜行 HYAKKI YAGYO</title>
<style>
  /* 共用版面在 arcade-core/ui/hud.css(src/main.js import);這裡只設這款的閃避鈕 */
  :root{--loop-label:"飛躍";--loop-fs:1.0;--loop-bg:rgba(30,42,74,.5)}
  /* 標題的朱色落款印章 */
  .seal{display:inline-block;margin:.3em 0 .1em;padding:.18em .3em;border:3px solid #d8323a;border-radius:4px;color:#d8323a;
    font-family:var(--cjk);font-weight:900;font-size:15px;line-height:1.15;letter-spacing:.1em;transform:rotate(-4deg);background:rgba(248,240,224,.9)}
</style>
</head>
<body class="title">
<canvas id="view"></canvas>
<div id="crt"></div>

<div id="hud">
  <div><div class="lbl blink" id="oneup">1UP</div><div id="score">00</div></div>
  <div class="c"><div class="lbl">HI-SCORE</div><div id="hi">20000</div></div>
  <div class="r"><div id="hudBtns"><button class="hbtn" id="btnMute" aria-label="sound">♪</button><button class="hbtn" id="btnPause" aria-label="pause">II</button></div><div id="stageNo"></div></div>
</div>
<div id="bossBar" class="hidden"><div id="bossName"></div><div id="bossHp"><div id="bossFill"></div></div></div>
<div id="hudB"><div id="lives"></div>
  <div id="status"><span id="evoName">Lv.1 見習童子</span><div class="r2"><div id="pwr"></div><div id="loops"></div></div><div id="xp"><div id="xpFill"></div></div></div>
  <div id="badges"></div></div>
<div id="msg"></div>
<button id="btnLoop" aria-label="飛躍">飛躍</button>
<div id="combo"></div>
<div id="feed"></div>
<div id="flash"></div>

<div id="title" class="overlay">
  <div class="card">
    <div class="logo big">百鬼夜行</div>
    <div class="year">HYAKKI YAGYO</div>
    <div class="sub">少年陰陽師 · 平安京三十夜</div>
    <div class="seal">浮世<br>繪卷</div>
    <button class="start blink" id="btnStart">TAP TO START</button>
    <div class="table">
      <span></span><span class="h">編隊中</span><span class="h">俯衝中</span>
      <img class="px" id="sBoss" alt="赤鬼"><span class="yellow">150</span><span class="yellow">400-1600</span>
      <img class="px" id="sBfly" alt="提燈妖"><span>80</span><span>160</span>
      <img class="px" id="sBee" alt="唐傘妖"><span>50</span><span>100</span>
    </div>
    <div class="table items">
      <span class="red">P</span><span class="h">靈力</span><span class="cyan">R</span><span class="h">疾風</span><span class="green">S</span><span class="h">結界</span>
      <span style="color:#c77dff">B</span><span class="h">爆符</span><span class="white">W</span><span class="h">白狐</span><span class="yellow">1UP</span><span class="h">糰子</span>
    </div>
    <div class="small">平安京三十夜 · BEST <span id="bestStage">1</span> · 選關(測試用全部開放)</div>
    <div class="row" id="stageSel"></div>
    <div class="hint" id="hint"></div>
    <div class="row"><button class="sbtn" id="btnSnd">SOUND ON</button><button class="sbtn" id="btnCrt">和紙 ON</button></div>
    <div class="small">HI-SCORE <span id="tHi">20000</span></div>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="card">
    <div class="logo" style="font-size:34px">PAUSE</div>
    <div class="row"><button class="sbtn" id="btnResume">RESUME</button><button class="sbtn" id="btnQuit">QUIT</button></div>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="card">
    <div class="logo" style="font-size:30px">RESULTS</div>
    <div class="res">
      <div class="red">SCORE <span class="white" id="rScore">0</span></div>
      <div class="red">第幾夜 <span class="white" id="rStage">1</span></div>
      <div class="yellow">位階 <span class="white" id="rEvo">Lv.1</span></div>
      <div class="yellow">MAX COMBO <span class="white" id="rCombo">0</span></div>
      <div class="yellow">ENEMIES DOWN <span class="white" id="rKills">0</span></div>
      <div class="yellow">SHOTS FIRED <span class="white" id="rShots">0</span></div>
      <div class="yellow">NUMBER OF HITS <span class="white" id="rHits">0</span></div>
      <div class="cyan">HIT-MISS RATIO <span class="white" id="rRatio">0 %</span></div>
    </div>
    <button class="start blink" id="btnAgain">TAP TO CONTINUE</button>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
