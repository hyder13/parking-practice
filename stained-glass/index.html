<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14121a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="彩窗騎士">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2314121a'/%3E%3Cpath d='M8 1 15 8 8 15 1 8z' fill='%232a5ad8'/%3E%3Cpath d='M8 1 15 8H1z' fill='%23e8203a'/%3E%3Ccircle cx='8' cy='8' r='2.4' fill='%23ffc830' stroke='%2314121a'/%3E%3Cpath d='M1 8h14M8 1v14' stroke='%2314121a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cinzel+Decorative:wght@900&display=swap" rel="stylesheet">
<title>彩窗騎士 STAINED GLASS KNIGHT</title>
<style>
  /* 共用版面在 arcade-core/ui/hud.css(src/main.js import,比這裡晚載入 → 這裡的選擇器都加 html 提高優先權);這裡只放這款的彩繪玻璃樣式 */
  html:root{--loop-label:"盾";--loop-fs:1.25;--loop-bg:rgba(42,90,216,.55);
    --red:#ff4a5a;--cyan:#7ae0ff;--yellow:#ffd850;--white:#fffaf0;--bg:#14121a;--line:#ffd850}
  html #crt{display:none!important} /* 光束 / 玻璃窗框在 shader 裡(skin.js LOOK.style),不用共用的紙紋 */
  html #btnLoop{border:3px solid #ffd850;box-shadow:0 0 12px rgba(255,216,80,.4)}
  html .overlay{background:radial-gradient(ellipse at 50% 40%,rgba(20,18,26,.35),rgba(20,18,26,.88))}
  /* 標題:玫瑰花窗(一圈圈彩色玻璃 + 鉛條)上面寫著金色的字 */
  html .rose{position:relative;width:min(300px,76vw,44vh);aspect-ratio:1;margin:0 auto .3em;border-radius:50%;
    background:
      repeating-conic-gradient(from 0deg,#14121a 0 1.2deg,transparent 1.2deg 30deg),
      radial-gradient(circle,#ffd850 0 12%,#14121a 12% 14%,transparent 14% 40%,#14121a 40% 42%,transparent 42% 70%,#14121a 70% 72%,transparent 72% 97%,#14121a 97%),
      conic-gradient(#e8203a 0 30deg,#2a5ad8 30deg 60deg,#3ab84a 60deg 90deg,#ffc830 90deg 120deg,#8a3ad8 120deg 150deg,#3ac8e8 150deg 180deg,
        #e8203a 180deg 210deg,#2a5ad8 210deg 240deg,#3ab84a 240deg 270deg,#ffc830 270deg 300deg,#8a3ad8 300deg 330deg,#3ac8e8 330deg);
    box-shadow:0 0 0 6px #14121a,0 0 30px rgba(255,216,80,.35);opacity:.92}
  html .rose .logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap}
  html #title .logo.big{font-family:var(--cjk);font-weight:900;font-size:clamp(34px,11vw,58px);letter-spacing:.06em;
    background:none;color:#ffd850;-webkit-text-stroke:2px #14121a;paint-order:stroke fill;
    text-shadow:0 3px 0 #14121a,0 0 12px rgba(20,18,26,.95);filter:none;margin:0}
  html #title .year{font-family:"Cinzel Decorative",Georgia,serif;font-weight:900;letter-spacing:.14em;color:#ffd850;text-shadow:0 2px 0 #14121a}
  html #title .sub{color:#7ae0ff}
</style>
</head>
<body class="title">
<canvas id="view"></canvas>
<div id="crt"></div>

<div id="hud">
  <div><div class="lbl blink" id="oneup">1UP</div><div id="score">00</div></div>
  <div class="c"><div class="lbl">HI-SCORE</div><div id="hi">20000</div></div>
  <div class="r"><div id="hudBtns"><button class="hbtn" id="btnMute" aria-label="sound">♪</button><button class="hbtn" id="btnPause" aria-label="pause">II</button></div><div id="stageNo"></div></div>
</div>
<div id="bossBar" class="hidden"><div id="bossName"></div><div id="bossHp"><div id="bossFill"></div></div></div>
<div id="hudB"><div id="lives"></div>
  <div id="status"><span id="evoName">Lv.1 見習侍從</span><div class="r2"><div id="pwr"></div><div id="loops"></div></div><div id="xp"><div id="xpFill"></div></div></div>
  <div id="badges"></div></div>
<div id="msg"></div>
<button id="btnLoop" aria-label="盾">盾</button>
<div id="combo"></div>
<div id="feed"></div>
<div id="flash"></div>

<div id="title" class="overlay">
  <div class="card">
    <div class="rose"><div class="logo big">彩窗騎士</div></div>
    <div class="year">STAINED GLASS KNIGHT</div>
    <div class="sub">小騎士 · 童話王國三十章</div>
    <button class="start blink" id="btnStart">TAP TO START</button>
    <div class="table">
      <span></span><span class="h">編隊中</span><span class="h">俯衝中</span>
      <img class="px" id="sBoss" alt="黑騎士"><span class="yellow">150</span><span class="yellow">400-1600</span>
      <img class="px" id="sBfly" alt="蝙蝠"><span>80</span><span>160</span>
      <img class="px" id="sBee" alt="哥布林"><span>50</span><span>100</span>
    </div>
    <div class="table items">
      <span class="red">P</span><span class="h">聖光</span><span class="cyan">R</span><span class="h">疾光</span><span class="green">S</span><span class="h">聖盾</span>
      <span style="color:#c77dff">B</span><span class="h">光之爆</span><span style="color:#f0f0f8">W</span><span class="h">獨角獸</span><span class="yellow">1UP</span><span class="h">蘋果派</span>
    </div>
    <div class="small">童話三十章 · BEST <span id="bestStage">1</span> · 選關(測試用全部開放)</div>
    <div class="row" id="stageSel"></div>
    <div class="hint" id="hint"></div>
    <div class="row"><button class="sbtn" id="btnSnd">SOUND ON</button><button class="sbtn" id="btnCrt">光束 ON</button></div>
    <div class="small">HI-SCORE <span id="tHi">20000</span></div>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="card">
    <div class="logo" style="font-size:34px">PAUSE</div>
    <div class="row"><button class="sbtn" id="btnResume">RESUME</button><button class="sbtn" id="btnQuit">QUIT</button></div>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="card">
    <div class="logo" style="font-size:30px">RESULTS</div>
    <div class="res">
      <div class="red">SCORE <span class="white" id="rScore">0</span></div>
      <div class="red">第幾章 <span class="white" id="rStage">1</span></div>
      <div class="yellow">騎士階級 <span class="white" id="rEvo">Lv.1</span></div>
      <div class="yellow">MAX COMBO <span class="white" id="rCombo">0</span></div>
      <div class="yellow">ENEMIES DOWN <span class="white" id="rKills">0</span></div>
      <div class="yellow">SHOTS FIRED <span class="white" id="rShots">0</span></div>
      <div class="yellow">NUMBER OF HITS <span class="white" id="rHits">0</span></div>
      <div class="cyan">HIT-MISS RATIO <span class="white" id="rRatio">0 %</span></div>
    </div>
    <button class="start blink" id="btnAgain">TAP TO CONTINUE</button>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
