<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1a3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="夜市美食大戰">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%232a1a3a'/%3E%3Crect x='5' y='5' width='6' height='9' rx='1' fill='%23d8b088'/%3E%3Crect x='4.5' y='4' width='7' height='1.5' fill='%23fff'/%3E%3Crect x='8' y='1' width='1' height='4' fill='%23ff5a8a'/%3E%3Ccircle cx='7' cy='12' r='.9' fill='%233a2418'/%3E%3Ccircle cx='9' cy='12.3' r='.9' fill='%233a2418'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<title>夜市美食大戰 NIGHT MARKET</title>
<style>
  /* 共用版面在 arcade-core/ui/hud.css(src/main.js import);這裡只設這款的閃避鈕 */
  :root{--loop-label:"借過";--loop-fs:1.0;--loop-bg:rgba(90,30,90,.45)}
  #title .logo.big{font-size:clamp(34px,12.5vw,72px);letter-spacing:.02em} /* 六個字的標題縮小一點,不換行 */
  /* 標題下的霓虹燈「營業中」 */
  .open{display:inline-block;margin:.35em 0 .1em;padding:.1em .5em;border:2px solid #ff5ad0;border-radius:8px;color:#ffe6fa;
    font-family:var(--cjk);font-weight:900;font-size:16px;letter-spacing:.3em;text-shadow:0 0 6px #ff5ad0,0 0 14px #ff5ad0;
    box-shadow:0 0 8px #ff5ad0,inset 0 0 8px #ff5ad0;animation:neon 2.4s infinite}
  @keyframes neon{0%,86%,100%{opacity:1}88%,92%{opacity:.35}90%{opacity:.9}}
</style>
</head>
<body class="title">
<canvas id="view"></canvas>
<div id="crt"></div>

<div id="hud">
  <div><div class="lbl blink" id="oneup">1UP</div><div id="score">00</div></div>
  <div class="c"><div class="lbl">HI-SCORE</div><div id="hi">20000</div></div>
  <div class="r"><div id="hudBtns"><button class="hbtn" id="btnMute" aria-label="sound">♪</button><button class="hbtn" id="btnPause" aria-label="pause">II</button></div><div id="stageNo"></div></div>
</div>
<div id="bossBar" class="hidden"><div id="bossName"></div><div id="bossHp"><div id="bossFill"></div></div></div>
<div id="hudB"><div id="lives"></div>
  <div id="status"><span id="evoName">Lv.1 小吃貨</span><div class="r2"><div id="pwr"></div><div id="loops"></div></div><div id="xp"><div id="xpFill"></div></div></div>
  <div id="badges"></div></div>
<div id="msg"></div>
<button id="btnLoop" aria-label="借過">借過</button>
<div id="combo"></div>
<div id="feed"></div>
<div id="flash"></div>

<div id="title" class="overlay">
  <div class="card">
    <div class="logo big">夜市美食大戰</div>
    <div class="year">NIGHT MARKET</div>
    <div class="sub">小吃貨 · 夜市三十攤</div>
    <div class="open">營業中</div>
    <button class="start blink" id="btnStart">TAP TO START</button>
    <div class="table">
      <span></span><span class="h">編隊中</span><span class="h">俯衝中</span>
      <img class="px" id="sBoss" alt="刈包"><span class="yellow">150</span><span class="yellow">400-1600</span>
      <img class="px" id="sBfly" alt="雞排"><span>80</span><span>160</span>
      <img class="px" id="sBee" alt="臭豆腐"><span>50</span><span>100</span>
    </div>
    <div class="table items">
      <span class="red">P</span><span class="h">加料</span><span class="cyan">R</span><span class="h">手速</span><span class="green">S</span><span class="h">保溫袋</span>
      <span style="color:#c77dff">B</span><span class="h">爆米香</span><span style="color:#ff8a2a">W</span><span class="h">外送員</span><span class="yellow">1UP</span><span class="h">雞蛋糕</span>
    </div>
    <div class="small">夜市三十攤 · BEST <span id="bestStage">1</span> · 選關(測試用全部開放)</div>
    <div class="row" id="stageSel"></div>
    <div class="hint" id="hint"></div>
    <div class="row"><button class="sbtn" id="btnSnd">SOUND ON</button><button class="sbtn" id="btnCrt">紙紋 ON</button></div>
    <div class="small">HI-SCORE <span id="tHi">20000</span></div>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="card">
    <div class="logo" style="font-size:34px">PAUSE</div>
    <div class="row"><button class="sbtn" id="btnResume">RESUME</button><button class="sbtn" id="btnQuit">QUIT</button></div>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="card">
    <div class="logo" style="font-size:30px">RESULTS</div>
    <div class="res">
      <div class="red">SCORE <span class="white" id="rScore">0</span></div>
      <div class="red">第幾攤 <span class="white" id="rStage">1</span></div>
      <div class="yellow">吃貨等級 <span class="white" id="rEvo">Lv.1</span></div>
      <div class="yellow">MAX COMBO <span class="white" id="rCombo">0</span></div>
      <div class="yellow">ENEMIES DOWN <span class="white" id="rKills">0</span></div>
      <div class="yellow">SHOTS FIRED <span class="white" id="rShots">0</span></div>
      <div class="yellow">NUMBER OF HITS <span class="white" id="rHits">0</span></div>
      <div class="cyan">HIT-MISS RATIO <span class="white" id="rRatio">0 %</span></div>
    </div>
    <button class="start blink" id="btnAgain">TAP TO CONTINUE</button>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
