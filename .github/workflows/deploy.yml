name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # 星際小蜜蜂 3D(star-bees/ 是獨立的 Vite 專案)→ 放到 /star-bees/ 子路徑
      - run: npm ci && npm run build
        working-directory: star-bees
      - run: cp -r star-bees/dist dist/star-bees
      # 蒼空王牌 1945(sky-aces/,星際小蜜蜂換皮的二戰空戰)→ /sky-aces/
      - run: npm ci && npm run build
        working-directory: sky-aces
      - run: cp -r sky-aces/dist dist/sky-aces
      # 齊天大聖(monkey-king/,西遊記主題換皮)→ /monkey-king/
      - run: npm ci && npm run build
        working-directory: monkey-king
      - run: cp -r monkey-king/dist dist/monkey-king
      # 三國英雄(three-kingdoms/,三國主題換皮)→ /three-kingdoms/
      - run: npm ci && npm run build
        working-directory: three-kingdoms
      - run: cp -r three-kingdoms/dist dist/three-kingdoms
      # 鬧熱廟會(temple-fair/,台灣廟會主題換皮)→ /temple-fair/
      - run: npm ci && npm run build
        working-directory: temple-fair
      - run: cp -r temple-fair/dist dist/temple-fair

      - run: npm ci && npm run build
        working-directory: yokai-night
      - run: cp -r yokai-night/dist dist/yokai-night

      - run: npm ci && npm run build
        working-directory: night-market
      - run: cp -r night-market/dist dist/night-market

      - run: npm ci && npm run build
        working-directory: animal-brawl
      - run: cp -r animal-brawl/dist dist/animal-brawl

      - run: npm ci && npm run build
        working-directory: sengoku
      - run: cp -r sengoku/dist dist/sengoku

      - run: npm ci && npm run build
        working-directory: cartoon-1930
      - run: cp -r cartoon-1930/dist dist/cartoon-1930

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
